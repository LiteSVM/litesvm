name: release NodeJS

on:
  push:
    tags:
      - "node-v[0-9]+.[0-9]+.[0-9]+"
      - "node-v[0-9]+.[0-9]+.[0-9]+-*"

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Setup node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          check-latest: true
          cache: yarn
          cache-dependency-path: yarn.lock
      - name: Upgrade npm for trusted publishing
        run: npm install -g npm@latest
      - name: Install dependencies
        run: corepack enable && yarn install --immutable
      - name: Create native package directories
        run: yarn workspace litesvm-core napi create-npm-dirs
      - name: Download all native artifacts
        uses: dawidd6/action-download-artifact@v11
        with:
          workflow: node-build.yml
          path: crates/node-litesvm-core/artifacts
      - name: Move native artifacts
        run: yarn workspace litesvm-core artifacts
      - name: Build wrappers
        run: |
          yarn workspace litesvm build
          yarn workspace litesvm-web3js build
      - name: List native packages
        run: ls -R crates/node-litesvm-core/npm
      - name: Publish core and wrappers
        run: |
          TAG=latest
          [[ "$GITHUB_REF_NAME" == *-rc.* ]] && TAG=next
          (cd crates/node-litesvm-core && npm publish --access public --tag "$TAG")
          yarn workspace litesvm pack --out "$RUNNER_TEMP/litesvm.tgz"
          yarn workspace litesvm-web3js pack --out "$RUNNER_TEMP/litesvm-web3js.tgz"
          npm publish "$RUNNER_TEMP/litesvm.tgz" --access public --tag "$TAG"
          npm publish "$RUNNER_TEMP/litesvm-web3js.tgz" --access public --tag "$TAG"
