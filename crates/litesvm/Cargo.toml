[package]
name = "litesvm"
description = "A fast and lightweight Solana VM simulator for testing solana programs"
license.workspace = true
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
readme = "../../README.md"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
default = []
fixture = ["dep:litesvm-fixture"]
invocation-inspect-callback = ["litesvm-core/invocation-inspect-callback"]
nodejs-internal = ["litesvm-core/nodejs-internal"]
hashbrown = ["litesvm-core/hashbrown"]
sbpf-debugger = ["litesvm-core/sbpf-debugger"]
serde = ["litesvm-core/serde"]
persistence-internal = ["litesvm-core/persistence-internal"]
precompiles = ["litesvm-core/precompiles"]
register-tracing = ["litesvm-core/register-tracing"]

[dependencies]
litesvm-core.workspace = true
litesvm-fixture = { workspace = true, optional = true }

[dev-dependencies]
agave-feature-set.workspace = true
criterion.workspace = true
ed25519-dalek.workspace = true
hashbrown.workspace = true
libsecp256k1.workspace = true
serde.workspace = true
solana-account.workspace = true
solana-address.workspace = true
solana-address-lookup-table-interface = { workspace = true, features = ["bincode", "bytemuck"] }
solana-clock.workspace = true
solana-compute-budget.workspace = true
solana-compute-budget-interface.workspace = true
solana-ed25519-program.workspace = true
solana-epoch-schedule.workspace = true
solana-feature-gate-interface = { workspace = true, features = ["bincode"] }
solana-hash.workspace = true
solana-instruction.workspace = true
solana-keypair.workspace = true
solana-loader-v3-interface = { workspace = true, features = ["wincode"] }
solana-message.workspace = true
solana-native-token.workspace = true
solana-nonce.workspace = true
solana-program-option.workspace = true
solana-program-pack.workspace = true
solana-program-error.workspace = true
solana-program-runtime.workspace = true
solana-rent.workspace = true
solana-secp256k1-program = { workspace = true, features = ["bincode"] }
solana-sdk-ids.workspace = true
solana-signature.workspace = true
solana-signer.workspace = true
solana-stake-interface.workspace = true
solana-svm-callback = { workspace = true, features = ["agave-unstable-api"] }
solana-system-interface = { workspace = true, features = ["bincode"] }
solana-transaction = { workspace = true, features = ["verify"] }
solana-transaction-context.workspace = true
solana-transaction-error.workspace = true
solana-vote-interface = { workspace = true, features = ["bincode"] }
spl-associated-token-account-interface.workspace = true
spl-token-interface.workspace = true
test-log.workspace = true
wincode.workspace = true

[lints]
workspace = true

[[test]]
name = "precompiles"
required-features = ["precompiles"]

[[test]]
name = "fixture_macro"
required-features = ["fixture"]

[[bench]]
name = "simple_bench"
harness = false

[[bench]]
name = "max_perf"
harness = false

[[bench]]
name = "set_clock"
harness = false

[[bench]]
name = "hashing"
harness = false
